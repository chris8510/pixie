name: Release
# Builds installers for macOS, Windows and Linux and attaches them (plus the
# pixie-pet skill) to a DRAFT GitHub release named after package.json's version.
#
# Runs when
#   - main gets a push and no tag v<version> exists yet (bump "version" to release), or
#   - a tag v* is pushed, or
#   - it's started by hand (Actions → Release → Run workflow).
# Review the draft on the Releases page, then click "Publish" – that creates the tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released – bump the version in package.json to release again."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --test --test-timeout=60000
        timeout-minutes: 5
      - run: npx electron-builder --publish always
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple/Windows signing certificates yet – build unsigned.
          # Add CSC_LINK / CSC_KEY_PASSWORD (and APPLE_ID…) secrets later to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # The Claude skill for making pets, as a zip for the Claude app.
  skill:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd skills && zip -r ../pixie-pet-skill.zip pixie-pet
      - run: gh release upload "v${{ needs.check.outputs.version }}" pixie-pet-skill.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
